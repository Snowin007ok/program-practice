<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ucl Bakery Navbar</title>

<style>
/* ============================================================
   THEME COLOURS
   All the pink bakery colours live here in one place, so you
   can change the whole look by editing just these values.
   ============================================================ */
:root{
  --pink:#f8628f;
  --pink-light:#ff8fb1;
  --pink-pale:#ffe0ea;
  --pink-dark:#d43f6b;
  --page-bg:#fff5f8;

  /* one speed for everything, so the menu never feels sluggish */
  --speed:.22s;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--page-bg);
}

/* ============================================================
   NAVBAR STRUCTURE
   The navbar is one horizontal bar:
     [ logo + brand ] ....... [ nav links ] [ hamburger ]
   .container is a flex row. The brand has margin-right:auto,
   which pushes everything else over to the right side.
   ============================================================ */
.navbar{
  background:linear-gradient(90deg,var(--pink-light),var(--pink));
  padding:16px 30px;
  border-bottom:4px dotted var(--pink-pale);
  box-shadow:0 4px 14px rgba(248,98,143,.25);

  /* the mega menu is positioned against the navbar */
  position:relative;
}

.container{
  max-width:1200px;
  width:90%;
  margin:auto;
  display:flex;
  align-items:center;
}

/* ============================================================
   THE TWO HIDDEN CHECKBOXES  ("the checkbox trick")
   This page has no JavaScript, so the open/closed state has to
   be stored somewhere CSS can read. A checkbox is that place:
   clicking a <label> ticks its checkbox, and CSS reacts with
   :checked. That is what opens the mobile menu and the mobile
   dropdown.

   The checkboxes are invisible but NOT display:none, so the
   keyboard and screen readers can still reach them.
   ============================================================ */
.nav-check,
.menu-check{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  margin:0;
}

/* --- brand (logo image + bakery name) --- */
.brand{
  color:white;
  text-decoration:none;
  font-size:24px;
  font-weight:bold;
  margin-right:auto;      /* pushes the nav links to the right */
  display:flex;
  align-items:center;
  gap:12px;
  letter-spacing:.5px;
  text-shadow:0 1px 2px rgba(0,0,0,.15);
}

.brand-logo{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  transition:transform .3s ease;
}

.brand:hover .brand-logo{
  transform:rotate(-8deg) scale(1.06);
}

/* --- the row of links --- */
.nav-links{
  list-style:none;        /* remove the bullet points */
  display:flex;
  align-items:center;
  gap:25px;
  margin:0;
  padding:0;
}

.nav-links a,
.menu-toggle{
  color:white;
  text-decoration:none;
  font-size:16px;
  position:relative;      /* needed for the ::after underline */
}

/* the Menu label is styled to look exactly like the other links */
.menu-toggle{
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  user-select:none;       /* stop the text highlighting on tap */
}

/* ============================================================
   HOVER EFFECT
   A 2px white bar is drawn under each link with ::after.
   It starts at width:0 and grows to 100% on hover. The
   transition is what makes it slide out smoothly.
   ============================================================ */
.nav-links a::after,
.menu-toggle::after{
  content:"";
  position:absolute;
  width:0;
  height:2px;
  background:white;
  bottom:-6px;
  left:0;
  transition:width var(--speed) ease;
}

.nav-links a:hover::after,
.menu-toggle:hover::after,
.menu-item:hover .menu-toggle::after,
.menu-item:focus-within .menu-toggle::after{
  width:100%;
}

/* ============================================================
   KEYBOARD FOCUS
   :focus-visible shows the ring for keyboard users only.
   A <label> cannot take focus itself, so it borrows the ring
   from its checkbox with :focus-visible + label.
   ============================================================ */
.brand:focus-visible,
.nav-links a:focus-visible,
.nav-check:focus-visible ~ .hamburger,
.menu-check:focus-visible + .menu-toggle{
  outline:3px solid #fff;
  outline-offset:4px;
  border-radius:4px;
}

/* inside the white panel a white ring would be invisible,
   so those links get a pink one instead */
.mega-column a:focus-visible{
  outline:3px solid var(--pink);
  outline-offset:2px;
  border-radius:8px;
}

/* the little arrow rotates when the mega menu is open */
.arrow{
  font-size:12px;
  transition:transform var(--speed) ease;
}

.menu-item:hover .arrow,
.menu-item:focus-within .arrow{
  transform:rotate(180deg);
}

/* --- CTA button --- */
.cta{
  background:white;
  color:var(--pink-dark)!important;
  padding:10px 20px;
  border-radius:999px;
  font-weight:bold;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  transition:background var(--speed) ease;
}

.cta::after{
  display:none;           /* no underline on the button */
}

.cta:hover{
  background:var(--pink-pale);
}

/* ============================================================
   MEGA MENU LAYOUT
   The panel is positioned absolutely under the navbar, and
   its inside is a 3-column CSS grid - one grid cell per
   category (Cakes / Bakery / Special).

   Note there is NO gap between the navbar and the panel: the
   panel starts at top:100%, flush against the bar. That is
   what lets the pointer travel from "Menu" down into the
   dropdown without ever leaving the menu area.
   ============================================================ */
.menu-item{
  position:static;        /* so the panel can span the full navbar */
}

.mega-menu{
  /* hidden by default: invisible, unclickable, nudged up a bit.
     visibility (not display) is used because display cannot be
     animated - this way the panel can fade. */
  opacity:0;
  visibility:hidden;
  transform:translateY(-8px);
  transition:opacity var(--speed) ease,
             transform var(--speed) ease,
             visibility var(--speed);

  position:absolute;
  top:100%;               /* directly below the navbar */
  left:0;
  right:0;
  z-index:100;

  background:white;
  border:1px solid var(--pink-pale);
  border-radius:0 0 16px 16px;
  box-shadow:0 10px 30px rgba(248,98,143,.25);
  padding:28px 30px;

  /* on a short laptop screen the panel scrolls instead of
     running off the bottom of the window */
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}

/* ON DESKTOP: hovering the whole .menu-item reveals the panel.
   Because .menu-item wraps BOTH the label and the panel, the
   pointer can travel down into the dropdown without the hover
   ever breaking. :focus-within does the same job for someone
   tabbing through with the keyboard. */
.menu-item:hover .mega-menu,
.menu-item:focus-within .mega-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* the 3 columns */
.mega-inner{
  max-width:1200px;
  width:90%;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.mega-column h3{
  margin:0 0 14px;
  font-size:15px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--pink-dark);
  padding-bottom:10px;
  border-bottom:2px dotted var(--pink-pale);
}

.mega-column ul{
  list-style:none;
  margin:0;
  padding:0;
}

.mega-column li{
  margin-bottom:4px;
}

.mega-column a{
  color:#5a4b50;
  text-decoration:none;
  font-size:15px;
  display:block;
  padding:8px 10px;
  border-radius:8px;
  transition:background .2s ease,color .2s ease,padding-left .2s ease;
}

.mega-column a::after{
  display:none;           /* no sliding underline inside the panel */
}

.mega-column a:hover{
  background:var(--page-bg);
  color:var(--pink-dark);
  padding-left:16px;      /* the link nudges right on hover */
}

/* --- hamburger label (hidden on desktop) --- */
.hamburger{
  display:none;
  color:white;
  font-size:30px;
  line-height:1;
  cursor:pointer;
  user-select:none;
}

/* only one of the two icons is shown at a time */
.icon-close{
  display:none;
}

/* --- the picture under the navbar --- */
.hero{
  max-width:1200px;
  width:90%;
  margin:30px auto;
}

.hero-img{
  display:block;
  width:100%;
  height:auto;
  border-radius:14px;
  border:5px solid #fff;
  box-shadow:0 6px 20px rgba(248,98,143,.3);
}

/* ============================================================
   RESPONSIVE MEDIA QUERY
   Everything below only applies on screens 700px or narrower
   (phones and small tablets). The links stack vertically and
   the hamburger appears.

   The :checked rules live INSIDE this media query on purpose,
   so a stray click on desktop can never leave the phone layout
   stuck open.
   ============================================================ */
@media(max-width:700px){

.navbar{
  padding:12px 16px;
}

.container{
  width:100%;
  flex-wrap:wrap;         /* let the links drop to a second row */
}

.brand{
  font-size:20px;
  gap:10px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-width:2px;
}

.hamburger{
  display:block;
  padding:0 4px;
}

/* tick the checkbox -> swap the icon from ☰ to × */
.nav-check:checked ~ .hamburger .icon-open{
  display:none;
}

.nav-check:checked ~ .hamburger .icon-close{
  display:block;
}

/* The open menu is capped to the height of the screen and
   scrolls inside itself. On a short phone in landscape this is
   what stops the last links (and Order Now) from being cut off
   below the fold with no way to reach them. */
.nav-links{
  width:100%;
  flex-direction:column;
  align-items:stretch;
  gap:0;

  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
  -webkit-overflow-scrolling:touch;
}

.nav-check:checked ~ .nav-links{
  max-height:calc(100vh - 90px);
  overflow-y:auto;
  margin-top:12px;
}

.nav-links > li{
  border-top:1px solid rgba(255,255,255,.35);
}

/* padding gives every row a comfortable 48px tap target */
.nav-links a,
.menu-toggle{
  display:block;
  width:100%;
  padding:14px 4px;
  font-size:17px;
  text-align:left;
}

/* the sliding underline looks wrong on stacked links */
.nav-links a::after,
.menu-toggle::after{
  display:none;
}

.menu-toggle{
  display:flex;
  justify-content:space-between;
}

.nav-links .cta{
  display:inline-block;
  width:auto;
  margin:14px 4px;
  padding:12px 24px;
  text-align:center;
}

/* On mobile the panel is not a floating dropdown - it becomes
   part of the stacked list and slides open when tapped. */
.mega-menu{
  position:static;        /* flows inline instead of floating */
  transform:none;
  background:transparent;
  border:none;
  box-shadow:none;
  padding:0;

  opacity:1;              /* a phone has no hover, so no fade */
  visibility:visible;
  max-height:0;           /* closed by default */
  overflow:hidden;
  transition:max-height .3s ease;
}

/* Hover must NOT open the panel here. On a touchscreen a tap
   leaves a lingering "hover" behind, which would make the panel
   stick open and ignore the toggle. The checkbox is the only
   thing allowed to open it on mobile. */
.menu-item:hover .mega-menu,
.menu-item:focus-within .mega-menu{
  transform:none;
  max-height:0;
}

.menu-check:checked ~ .mega-menu,
.menu-item:hover .menu-check:checked ~ .mega-menu,
.menu-item:focus-within .menu-check:checked ~ .mega-menu{
  max-height:1200px;      /* taller than the list can ever be */
  padding-bottom:10px;
}

/* the arrow follows the checkbox instead of hover */
.menu-item:hover .arrow,
.menu-item:focus-within .arrow{
  transform:none;
}

.menu-check:checked ~ .menu-toggle .arrow{
  transform:rotate(180deg);
}

.mega-inner{
  width:100%;
  grid-template-columns:1fr;   /* 3 columns become 1 */
  gap:14px;
}

.mega-column h3{
  color:white;
  border-bottom-color:rgba(255,255,255,.4);
  margin-bottom:8px;
}

.mega-column a{
  color:white;
  padding:10px 12px;
}

.mega-column a:hover{
  background:rgba(255,255,255,.15);
  color:white;
}

.mega-column a:focus-visible{
  outline-color:#fff;
}

.hero{
  width:100%;
  margin:16px 0;
  padding:0 16px;
}

}

/* Some people get motion sick from sliding panels. This turns
   the movement off while keeping everything usable. */
@media(prefers-reduced-motion:reduce){
  *{
    transition-duration:.01ms!important;
    animation-duration:.01ms!important;
  }
}
</style>

</head>

<body>

<!-- ==========================================================
     NAVBAR
     <nav> wraps the whole thing, the links are a <ul> of <li>,
     and the two toggles are checkbox + label pairs - that is
     how a menu opens and closes with no JavaScript at all.
     ========================================================== -->
<nav class="navbar" aria-label="Main navigation">

<div class="container">

<!-- this checkbox holds the "is the mobile menu open?" state.
     It is first in the markup so the ~ selector below it can
     reach the hamburger and the link list. -->
<input type="checkbox" id="navCheck" class="nav-check"
aria-label="Open navigation menu">

<a href="" class="brand">
<img src="images/cake.png" alt="" class="brand-logo">
Ucl Bakery
</a>

<!-- clicking this label ticks the checkbox above -->
<label for="navCheck" class="hamburger">
<span class="icon-open">☰</span>
<span class="icon-close">×</span>
</label>

<ul class="nav-links" id="navLinks">

  <!-- MENU - opens the mega dropdown.
       The panel lives INSIDE this <li>, so the pointer never
       leaves the .menu-item while moving down into it. -->
  <li class="menu-item">
    <input type="checkbox" id="menuCheck" class="menu-check"
    aria-label="Open the Menu categories">

    <label for="menuCheck" class="menu-toggle">
      Menu <span class="arrow" aria-hidden="true">▾</span>
    </label>

    <!-- the mega dropdown: 3 columns -->
    <div class="mega-menu">
      <div class="mega-inner">

        <div class="mega-column">
          <h3 id="col-cakes">Cakes</h3>
          <ul aria-labelledby="col-cakes">
            <li><a href="/cakes/birthday">Birthday Cakes</a></li>
            <li><a href="/cakes/wedding">Wedding Cakes</a></li>
            <li><a href="/cakes/chocolate">Chocolate Cakes</a></li>
            <li><a href="/cakes/custom">Custom Cakes</a></li>
          </ul>
        </div>

        <div class="mega-column">
          <h3 id="col-bakery">Bakery</h3>
          <ul aria-labelledby="col-bakery">
            <li><a href="/bakery/bread">Bread</a></li>
            <li><a href="/bakery/croissants">Croissants</a></li>
            <li><a href="/bakery/cookies">Cookies</a></li>
            <li><a href="/bakery/pastries">Pastries</a></li>
          </ul>
        </div>

        <div class="mega-column">
          <h3 id="col-special">Special</h3>
          <ul aria-labelledby="col-special">
            <li><a href="/special/eggless">Eggless</a></li>
            <li><a href="/special/vegan">Vegan</a></li>
            <li><a href="/special/seasonal">Seasonal Specials</a></li>
            <li><a href="/special/gift-boxes">Gift Boxes</a></li>
          </ul>
        </div>

      </div>
    </div>
  </li>

  <!-- normal links -->
  <li><a href="https://maps.app.goo.gl/uQ8o3grnUYztHUL48">Locations</a></li>
  <li><a href="/customise">Customise</a></li>

  <!-- call-to-action button -->
  <li><a href="/order" class="cta">Order Now</a></li>

</ul>

</div>

</nav>

<main class="hero">
<img src="images/messi.jpg" alt="Lionel Messi kissing the World Cup trophy" class="hero-img">
</main>

</body>
</html>
