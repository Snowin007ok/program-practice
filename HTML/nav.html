<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ucl Bakery Navbar</title>

<style>
/* ============================================================
   THEME COLOURS
   All the pink bakery colours live here in one place, so you
   can change the whole look by editing just these values.
   ============================================================ */
:root{
  --pink:#f8628f;
  --pink-light:#ff8fb1;
  --pink-pale:#ffe0ea;
  --pink-dark:#d43f6b;
  --page-bg:#fff5f8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--page-bg);
}

/* ============================================================
   1. NAVBAR STRUCTURE
   The navbar is one horizontal bar:
     [ logo + brand ] ....... [ nav links ] [ hamburger ]
   .container is a flex row. The brand has margin-right:auto,
   which pushes everything else over to the right side.
   ============================================================ */
.navbar{
  background:linear-gradient(90deg,var(--pink-light),var(--pink));
  padding:16px 30px;
  border-bottom:4px dotted var(--pink-pale);
  box-shadow:0 4px 14px rgba(248,98,143,.25);

  /* the mega menu is positioned against the navbar */
  position:relative;
}

.container{
  max-width:1200px;
  width:90%;
  margin:auto;
  display:flex;
  align-items:center;
}

/* --- brand (logo image + bakery name) --- */
.brand{
  color:white;
  text-decoration:none;
  font-size:24px;
  font-weight:bold;
  margin-right:auto;      /* pushes the nav links to the right */
  display:flex;
  align-items:center;
  gap:12px;
  letter-spacing:.5px;
  text-shadow:0 1px 2px rgba(0,0,0,.15);
}

.brand-logo{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  transition:transform .3s ease;
}

.brand:hover .brand-logo{
  transform:rotate(-8deg) scale(1.06);
}

/* --- the row of links --- */
.nav-links{
  list-style:none;        /* remove the bullet points */
  display:flex;
  align-items:center;
  gap:25px;
  margin:0;
  padding:0;
}

.nav-links a,
.menu-toggle{
  color:white;
  text-decoration:none;
  font-size:16px;
  position:relative;      /* needed for the ::after underline */
}

/* the Menu button is a <button>, so reset the browser defaults
   to make it look exactly like the other links */
.menu-toggle{
  background:none;
  border:none;
  font-family:inherit;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  gap:6px;
}

/* ============================================================
   6. HOVER EFFECT
   A 2px white bar is drawn under each link with ::after.
   It starts at width:0 and grows to 100% on hover. The
   transition is what makes it slide out smoothly.
   ============================================================ */
.nav-links a::after,
.menu-toggle::after{
  content:"";
  position:absolute;
  width:0;
  height:2px;
  background:white;
  bottom:-6px;
  left:0;
  transition:width .3s ease;
}

.nav-links a:hover::after,
.menu-toggle:hover::after,
.menu-item:hover .menu-toggle::after{
  width:100%;
}

/* the little ▾ arrow rotates when the mega menu is open */
.arrow{
  font-size:12px;
  transition:transform .3s ease;
}

.menu-item:hover .arrow,
.menu-toggle[aria-expanded="true"] .arrow{
  transform:rotate(180deg);
}

/* --- 5. CTA button --- */
.cta{
  background:white;
  color:var(--pink-dark)!important;
  padding:10px 20px;
  border-radius:999px;
  font-weight:bold;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  transition:background .3s ease;
}

.cta::after{
  display:none;           /* no underline on the button */
}

.cta:hover{
  background:var(--pink-pale);
}

/* ============================================================
   2. MEGA MENU LAYOUT
   The panel is positioned absolutely under the navbar, and
   its inside is a 3-column CSS grid — one grid cell per
   category (Cakes / Bakery / Special).
   ============================================================ */
.menu-item{
  position:static;        /* so the panel can span the full navbar */
}

.mega-menu{
  /* hidden by default: invisible, unclickable, nudged up a bit */
  opacity:0;
  visibility:hidden;
  transform:translateY(-10px);
  transition:opacity .3s ease,transform .3s ease,visibility .3s;

  position:absolute;
  top:100%;               /* directly below the navbar */
  left:0;
  right:0;
  z-index:100;

  background:white;
  border:1px solid var(--pink-pale);
  border-radius:0 0 16px 16px;
  box-shadow:0 10px 30px rgba(248,98,143,.25);
  padding:28px 30px;
}

/* 8. ON DESKTOP: hovering the Menu list item reveals the panel.
   Keeping :hover on .menu-item (which contains BOTH the button
   and the panel) means the panel stays open while the mouse
   travels down into it. :focus-within does the same for
   keyboard users tabbing through the links. */
.menu-item:hover .mega-menu,
.menu-item:focus-within .mega-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* the 3 columns */
.mega-inner{
  max-width:1200px;
  width:90%;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.mega-column h3{
  margin:0 0 14px;
  font-size:15px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--pink-dark);
  padding-bottom:10px;
  border-bottom:2px dotted var(--pink-pale);
}

.mega-column ul{
  list-style:none;
  margin:0;
  padding:0;
}

.mega-column li{
  margin-bottom:4px;
}

.mega-column a{
  color:#5a4b50;
  text-decoration:none;
  font-size:15px;
  display:block;
  padding:8px 10px;
  border-radius:8px;
  transition:background .2s ease,color .2s ease,padding-left .2s ease;
}

.mega-column a::after{
  display:none;           /* no sliding underline inside the panel */
}

.mega-column a:hover{
  background:var(--page-bg);
  color:var(--pink-dark);
  padding-left:16px;      /* the link nudges right on hover */
}

/* --- 9. hamburger button (hidden on desktop) --- */
.hamburger{
  display:none;
  background:none;
  border:none;
  color:white;
  font-size:30px;
  cursor:pointer;
}

/* --- the picture under the navbar --- */
.hero{
  max-width:1200px;
  width:90%;
  margin:30px auto;
}

.hero-img{
  display:block;
  width:100%;
  height:auto;
  border-radius:14px;
  border:5px solid #fff;
  box-shadow:0 6px 20px rgba(248,98,143,.3);
}

/* ============================================================
   RESPONSIVE MEDIA QUERY
   Everything below only applies on screens 700px or narrower
   (phones and small tablets). The links stack vertically and
   the hamburger button appears.
   ============================================================ */
@media(max-width:700px){

.navbar{
  padding:12px 16px;
}

.container{
  width:100%;
  flex-wrap:wrap;         /* let the links drop to a second row */
}

.brand{
  font-size:20px;
  gap:10px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-width:2px;
}

.hamburger{
  display:block;
  line-height:1;
  padding:0 4px;
}

/* the links become a full-width vertical list.
   max-height:0 + overflow:hidden hides them; the JS adds the
   .active class to open them, and the transition animates it. */
.nav-links{
  width:100%;
  flex-direction:column;
  align-items:stretch;
  gap:0;
  max-height:0;
  overflow:hidden;
  transition:max-height .4s ease;
}

.nav-links.active{
  max-height:900px;       /* any value taller than the real menu */
  margin-top:12px;
}

.nav-links > li{
  border-top:1px solid rgba(255,255,255,.35);
}

.nav-links a,
.menu-toggle{
  display:block;
  width:100%;
  padding:14px 4px;
  font-size:17px;
  text-align:left;
}

/* the sliding underline looks wrong on stacked links */
.nav-links a::after,
.menu-toggle::after{
  display:none;
}

.menu-toggle{
  display:flex;
  justify-content:space-between;
}

.nav-links .cta{
  display:inline-block;
  width:auto;
  margin:14px 4px;
  padding:12px 24px;
  text-align:center;
}

/* 10. ON MOBILE: no hover. The panel becomes a plain block that
   the JS opens and closes when the Menu button is tapped. */
.menu-item:hover .mega-menu,
.menu-item:focus-within .mega-menu{
  opacity:1;              /* cancel the desktop hover rule */
}

.mega-menu{
  position:static;        /* flows inline instead of floating */
  opacity:1;
  visibility:visible;
  transform:none;
  background:transparent;
  border:none;
  box-shadow:none;
  padding:0;

  max-height:0;           /* closed by default */
  overflow:hidden;
  transition:max-height .4s ease;
}

.mega-menu.open{
  max-height:900px;
  padding-bottom:10px;
}

.mega-inner{
  width:100%;
  grid-template-columns:1fr;   /* 3 columns become 1 */
  gap:14px;
}

.mega-column h3{
  color:white;
  border-bottom-color:rgba(255,255,255,.4);
  margin-bottom:8px;
}

.mega-column a{
  color:white;
  padding:10px 12px;
}

.mega-column a:hover{
  background:rgba(255,255,255,.15);
  color:white;
}

.hero{
  width:100%;
  margin:16px 0;
  padding:0 16px;
}

}
</style>

</head>

<body>

<!-- ==========================================================
     NAVBAR
     <nav> wraps the whole thing, the links are a <ul> of <li>,
     and Menu is a <button> because it performs an action
     (opening a panel) rather than going to a new page.
     ========================================================== -->
<nav class="navbar" aria-label="Main navigation">

<div class="container">

<a href="index.html" class="brand">
<img src="images/cake.png" alt="" class="brand-logo"
onerror="this.onerror=null;this.src='images/cake.svg';">
Ucl Bakery
</a>

<!-- 9. hamburger: only visible on mobile -->
<button
class="hamburger"
id="hamburgerBtn"
aria-label="Open navigation menu"
aria-expanded="false"
aria-controls="navLinks">
☰
</button>

<ul class="nav-links" id="navLinks">

  <!-- 1. MENU — opens the mega dropdown -->
  <li class="menu-item">
    <button
    class="menu-toggle"
    id="menuToggle"
    aria-expanded="false"
    aria-controls="megaMenu">
      Menu <span class="arrow" aria-hidden="true">▾</span>
    </button>

    <!-- 2. the mega dropdown: 3 columns -->
    <div class="mega-menu" id="megaMenu">
      <div class="mega-inner">

        <div class="mega-column">
          <h3>Cakes</h3>
          <ul>
            <li><a href="/cakes/birthday">Birthday Cakes</a></li>
            <li><a href="/cakes/wedding">Wedding Cakes</a></li>
            <li><a href="/cakes/chocolate">Chocolate Cakes</a></li>
            <li><a href="/cakes/custom">Custom Cakes</a></li>
          </ul>
        </div>

        <div class="mega-column">
          <h3>Bakery</h3>
          <ul>
            <li><a href="/bakery/bread">Bread</a></li>
            <li><a href="/bakery/croissants">Croissants</a></li>
            <li><a href="/bakery/cookies">Cookies</a></li>
            <li><a href="/bakery/pastries">Pastries</a></li>
          </ul>
        </div>

        <div class="mega-column">
          <h3>Special</h3>
          <ul>
            <li><a href="/special/eggless">Eggless</a></li>
            <li><a href="/special/vegan">Vegan</a></li>
            <li><a href="/special/seasonal">Seasonal Specials</a></li>
            <li><a href="/special/gift-boxes">Gift Boxes</a></li>
          </ul>
        </div>

      </div>
    </div>
  </li>

  <!-- 3 & 4. normal links -->
  <li><a href="https://maps.app.goo.gl/uQ8o3grnUYztHUL48">Locations</a></li>
  <li><a href="/customise">Customise</a></li>

  <!-- 5. call-to-action button -->
  <li><a href="/order" class="cta">Order Now</a></li>

</ul>

</div>

</nav>

<main class="hero">
<img src="images/messi.jpg" alt="Lionel Messi kissing the World Cup trophy" class="hero-img">
</main>

<script>
/* ==========================================================
   HAMBURGER JAVASCRIPT
   Grab the two elements, then toggle a CSS class on click.
   All the animation lives in the CSS — the JS only decides
   whether the class is on or off.
   ========================================================== */
const hamburgerBtn = document.getElementById("hamburgerBtn");
const navLinks     = document.getElementById("navLinks");

hamburgerBtn.addEventListener("click", () => {

  navLinks.classList.toggle("active");

  // classList.contains() tells us the state AFTER the toggle
  const isOpen = navLinks.classList.contains("active");

  // 12. tell screen readers whether the menu is open
  hamburgerBtn.setAttribute("aria-expanded", isOpen);
  hamburgerBtn.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");

  // swap the icon between ☰ and ×
  hamburgerBtn.textContent = isOpen ? "×" : "☰";
});


/* ==========================================================
   MEGA MENU ON MOBILE
   On desktop the panel opens on hover (pure CSS), so this
   click handler should only run on small screens. We check
   the window width to decide.
   ========================================================== */
const menuToggle = document.getElementById("menuToggle");
const megaMenu   = document.getElementById("megaMenu");

menuToggle.addEventListener("click", () => {

  // on desktop, do nothing — CSS :hover is already handling it
  if (window.innerWidth > 700) return;

  megaMenu.classList.toggle("open");

  const isOpen = megaMenu.classList.contains("open");
  menuToggle.setAttribute("aria-expanded", isOpen);
});


/* If the window is resized from mobile back to desktop, clear
   the mobile "open" class so the panel isn't stuck open. */
window.addEventListener("resize", () => {
  if (window.innerWidth > 700) {
    megaMenu.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");
  }
});
</script>

</body>
</html>
